spring:
  application:
    name: parking-api
  mvc:
    problemdetails:
      enabled: true

server:
  compression:
    enabled: true
    mime-types: application/json,application/problem+json
    min-response-size: 1KB

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  paths-to-match: /api/**
  default-produces-media-type: application/json
  override-with-generic-response: false
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    display-request-duration: true

app:
  provider-retry:
    max-retries: 2
    delay: 200ms

  provider-cache:
    ttl: 30s

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  cities:
    poitiers:
      center-lat: 46.5802
      center-lon: 0.3404
      radius-meters: 15000
      provider-type: poitiers
      base-url: ${POITIERS_PROVIDER_URL:https://data.grandpoitiers.fr/data-fair/api/v1/datasets/mobilites-stationnement-des-parkings-en-temps-reel/lines}
      timeout: 3s
